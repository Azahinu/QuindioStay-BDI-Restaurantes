# Configuracion de Conexion JDBC - QuindioStay (Dominio 4: Restaurantes)
# Motores soportados: sqlite (local sin instalacion), mysql (Entrega 2), sqlserver (Clase 18)
db.engine=sqlite
db.sqlite.path=data/quindiostay.db

# Configuracion MySQL 8.0 (Entrega 2)
db.mysql.url=jdbc:mysql://localhost:3306/quindiostay?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota
db.mysql.user=root
db.mysql.password=Quindio2026*

# Configuracion SQL Server (Clase 18 / Guia Docker)
db.sqlserver.url=jdbc:sqlserver://localhost:1433;databaseName=QuindioStay;encrypt=false;trustServerCertificate=true
db.sqlserver.user=sa
db.sqlserver.password=QuindioStay2026*

# Puerto HTTP del servidor web Java (JDK 21 HttpServer)
server.port=8080
